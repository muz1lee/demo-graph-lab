provider:
  name: google_gemini
  model: gemini-2.5-flash
  temperature: 0.1
  max_retries: 4

segmentation:
  sample_sec: 0.5
  frame_width: 224
  frames_per_sheet: 20
  columns: 5
  jpeg_quality: 95
  prompt: eef_object_role_trace_v2

output:
  save_contact_sheets: true
  save_raw_responses: true
  overwrite: false
