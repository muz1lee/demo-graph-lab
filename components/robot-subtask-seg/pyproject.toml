[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-subtask-seg"
version = "0.1.0"
description = "Standalone robot-video subtask segmentation reproduction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "av",
  "numpy",
  "pillow",
  "pydantic>=2",
  "pyyaml",
  "requests",
  "rich",
  "typer",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
gemini = ["google-genai"]
openai = ["openai"]

[project.scripts]
robot-subtask-seg = "robot_subtask_seg.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
