schema: ksm.robodojo.stage_guide.v1
guide_id: put_single_object_into_container_kw_aligned_v1
task_family: put_single_object_into_container
source: static_human_seed_kw_aligned
description: KW-aligned staged decomposition for the RoboDojo bottle-to-dustbin task family.
notes:
  - This guide is a temporary interface placeholder for the future video task decomposition module.
  - Physical-effect stages follow KW's existing verifier-gated skill pattern: a stage must self-verify before downstream stages can use its state.
  - Do not add a separate holding-verifier stage after pick; KW semantic pick already calls pick_verifier and returns pick_success.
stages:
  - stage_id: bind_selected_object_container
    label: bind selected bottle/container
    candidate_name: bind_selected_object_container
    candidate_type: subskill_candidate
    args:
      source_ref: string
      container_ref: string
      source_label: string
      container_label: string
    preconditions:
      - task metadata contains a selected source object and target container
      - visual labels or aliases exist for both objects
    expected_effects:
      - source/container binding is available to downstream stages
    observable_success:
      - binding.source_ref and binding.container_ref are non-empty
    required_primitives:
      - ksm_metadata_binding
    failure_modes:
      - wrong object instance selected
      - visual label does not match rendered object

  - stage_id: pick_bottle
    label: pick bottle
    candidate_name: pick_visual_object
    candidate_type: subskill_candidate
    args:
      arm_id: int
      source_label: string
    preconditions:
      - source object is visible
      - source object is graspable
      - source object has collision support
    expected_effects:
      - gripper closes on and verifies the selected bottle
    observable_success:
      - pickplace/semantic_pick.yaml returns pick_success true
      - holding(source) is true after the embedded pick_verifier gate
    required_primitives:
      - pickplace/semantic_pick.yaml
      - pickplace/pick_verifier.yaml
    failure_modes:
      - visual grounding selects the wrong bottle
      - grasp pose is unstable for bottle geometry
      - bottle slips before lift

  - stage_id: move_above_dustbin
    label: move above dustbin
    candidate_name: move_object_above_container
    candidate_type: subskill_candidate
    args:
      arm_id: int
      source_ref: string
      container_ref: string
      container_label: string
    preconditions:
      - holding(source) is true
      - container pose or visual target is available
    expected_effects:
      - held bottle is positioned above the dustbin opening or receptacle region
    observable_success:
      - end effector/object center is above the container region
    required_primitives:
      - native_container_approach_skill
    failure_modes:
      - container opening is not localized
      - approach pose collides with rim
      - motion planner avoids the needed over-bin pose

  - stage_id: release_into_dustbin
    label: release into dustbin
    candidate_name: release_into_container
    candidate_type: subskill_candidate
    args:
      arm_id: int
      source_ref: string
      container_ref: string
    preconditions:
      - bottle is above the dustbin receptacle
      - holding(source) has already been verified by the pick/place gate
    expected_effects:
      - gripper releases bottle into the container volume
    observable_success:
      - bottle trajectory enters container volume after release
    required_primitives:
      - pickplace/semantic_place.yaml
      - pickplace/pick_verifier.yaml
      - native_container_release_skill
    failure_modes:
      - bottle released outside container
      - bottle bounces off rim
      - release height or gripper timing is wrong

  - stage_id: verify_inside
    label: verify inside
    candidate_name: verify_inside
    candidate_type: subskill_candidate
    args:
      source_ref: string
      container_ref: string
    preconditions:
      - release stage has been attempted
    expected_effects:
      - system records whether source is inside container
    observable_success:
      - inside(source, container) is true
    required_primitives:
      - sim.eval.predicates.inside
    failure_modes:
      - predicate fails because object is outside container
      - object is visually inside but geometry AABB disagrees
      - scene asset lacks reliable geometry

  - stage_id: go_home
    label: go home
    candidate_name: return_home
    candidate_type: subskill_candidate
    args:
      arm_id: int
    preconditions:
      - manipulation stage is complete or aborted
    expected_effects:
      - robot returns to a safe home pose
    observable_success:
      - robot_home(robot) is true or go_home command succeeds
    required_primitives:
      - /ctrl/go_home
      - sim.eval.predicates.robot_home
    failure_modes:
      - robot fails to return home
      - go_home masks earlier task failure
