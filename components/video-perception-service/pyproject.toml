[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-video-perception-service"
version = "0.1.0"
description = "Local GPU service for continuous robot-video point tracking"
requires-python = ">=3.10"
dependencies = [
  "av",
  "fastapi",
  "numpy",
  "pillow",
  "pydantic>=2",
  "torch",
  "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
