# Oracle 演示约束图：insert_tubes_000
# 人工手写的"完美图"，用于上界实验：喂给 coding agent，检验约束图接口能否让 agent 写出可成功执行的 KW workflow。
# 数值来源标注见每条 provenance；hand_tuned 数值取自 wht 的 v7 手工 workflow（他趟出来的可行域），
# 自动化提取管线的目标是把这些 hand_tuned 替换为 demo/asset 推导值。

schema_version: 0.1
graph_id: insert_tubes_000__insert-tubes-demo
task_id: robodojo_insert_tubes_000
instruction: Insert the three tubes into the rack one by one.

source_demo:
  trace_id: insert_tubes__insert-tubes__refined_actions
  video: filtered_1024_task_videos/insert_tubes/insert-tubes.mp4
  duration_sec: 12.8

bindings:
  # label 体系沿用 task.yaml binding（provenance: task_spec）
  tube0: { scene_ref: tube0_prop, locate_label: "tube0_prop:dof" }
  tube1: { scene_ref: tube1_prop, locate_label: "tube1_prop:dof" }
  tube2: { scene_ref: tube2_prop, locate_label: "tube2_prop:dof" }
  rack:  { scene_ref: slot_prop,  locate_label: "test tube rack:dof" }

objects:
  tube_common: &tube_model
    category: test_tube
    asset: robodojo_derived_usdpreview_v1/Rigid/test_tube/00002
    mass_kg: 0.06                              # provenance: task_spec
    symmetry: revolute@local_z                 # 圆柱对称 → 抓取 yaw 自由。provenance: asset
    grasp_region:
      type: cylinder_side
      height_fraction: [0.55, 0.85]            # 抓上半段：太低→插入时夹爪撞 rack；太高→近管口易滑
      provenance: demo_video                   # 视频中夹爪落点在管身上部
    affordances:
      - insertable_into: rack
  tube0: *tube_model
  tube1: *tube_model
  tube2: *tube_model
  rack:
    category: test_tube_slot
    asset: robodojo_derived_usdpreview_v1/Geometry/test_tube_slot/00000
    physics: static                            # provenance: task_spec
    affordances:
      - receives: test_tube
        along_axis: world_-z                   # 插入方向竖直向下。provenance: demo_video
        slots:                                 # 槽位为 rack 的亚结构；横向偏移待 asset 精确化
          count_min: 3
          selection_rule: distinct_empty_slot  # 每根管必须进不同的空槽
          demo_assignment: left_to_right       # 演示中按从左到右依次占用。provenance: demo_video

nodes:
  # ---- 第 1 根 ----
  - id: grasp_tube0
    action_class: grasp
    demo_segment: { index: 0, t: [0.0, 1.5], label: "Grasp and lift the first tube" }
    actor_arm: left_arm                        # provenance: demo_video；单臂 harness 映射见 compile_notes
    objects: { manipulated: tube0 }
    preconditions: [gripper_empty(actor), on_table(tube0), upright(tube0)]
    postconditions: [holding(actor, tube0)]
    constraints:
      - type: grasp_constraint
        frame:
          region: tube0.grasp_region
          world_z_offset_hint: 0.075           # 抓取点高于 label 点的 z 偏移。provenance: hand_tuned (v7)
        approach: { direction: world_-z, standoff_waypoints_hint: [0.20, 0.13] }  # provenance: hand_tuned (v7)
        free_dof: [yaw_about_tube_axis]        # 由 symmetry 派生
        locked_dof: [approach_direction]
        gripper: { open_angle: 85, close_angle: 0, close_current_max: 160 }       # provenance: hand_tuned (v7)
    verify: { method: pick_verifier, use_model: true }
    recovery:
      max_retries: 1
      allowed_changes:
        - { param: frame.world_z_offset_hint, range: [0.05, 0.08] }               # v7 重试用 0.055
        - { param: gripper.close_current_max, range: [160, 200] }

  - id: insert_tube0
    action_class: insert
    demo_segment: { index: 1, t: [1.5, 4.0], label: "Insert the first tube into the rack" }
    actor_arm: left_arm
    objects: { manipulated: tube0, target: rack }
    preconditions: [holding(actor, tube0), slot_available(rack, slot_of(tube0))]
    postconditions: [inserted(tube0, rack), upright(tube0), gripper_empty(actor)]
    constraints:
      - type: alignment_constraint
        phase: pre_insert
        axis_a: tube0.local_z
        axis_b: world_-z                       # 即 rack.receives.along_axis 的反向
        max_angle_deg: 10                      # provenance: demo_video（trace requires_alignment=true）+ 判断
      - type: guarded_motion
        direction: world_-z
        max_travel_m: 0.10                     # provenance: hand_tuned (v7 insertion_delta)
        force_threshold_n: 8.0                 # provenance: hand_tuned (v7)；视觉 demo 提不出力，见 schema 开放问题
        success_signal: travel_complete_or_contact
      - type: grasp_constraint                 # 插入全程不允许换抓/松抓
        frame: { inherit_from: grasp_tube0 }
        locked_dof: [all_relative_object_motion]
    slot_binding: { rule: distinct_empty_slot, demo_choice: slot_index_0 }   # provenance: demo_video
    approach_hint: { pre_insert_z_offset: 0.18, retract_z_offset: 0.12 }     # provenance: hand_tuned (v7)
    verify: { method: predicate, predicates: [inserted(tube0, rack), upright(tube0)] }

  # ---- 第 2 根 ----
  - id: grasp_tube1
    action_class: grasp
    demo_segment: { index: 2, t: [4.5, 5.8], label: "Grasp and lift the second tube" }
    actor_arm: right_arm                       # provenance: demo_video
    objects: { manipulated: tube1 }
    preconditions: [gripper_empty(actor), on_table(tube1), upright(tube1)]
    postconditions: [holding(actor, tube1)]
    constraints:
      - type: grasp_constraint
        inherit_from: grasp_tube0              # 同类物体同约束，仅换 binding
    verify: { method: pick_verifier, use_model: true }
    recovery: { inherit_from: grasp_tube0 }

  - id: insert_tube1
    action_class: insert
    demo_segment: { index: 3, t: [5.8, 8.0], label: "Insert the second tube into the rack" }
    actor_arm: right_arm
    objects: { manipulated: tube1, target: rack }
    preconditions: [holding(actor, tube1), slot_available(rack, slot_of(tube1))]
    postconditions: [inserted(tube1, rack), upright(tube1), gripper_empty(actor)]
    constraints:
      - { inherit_from: insert_tube0.constraints }
    slot_binding: { rule: distinct_empty_slot, demo_choice: slot_index_1 }   # 不同于 tube0 的槽位！
    approach_hint: { inherit_from: insert_tube0 }
    verify: { method: predicate, predicates: [inserted(tube1, rack), upright(tube1)] }

  # ---- 第 3 根 ----
  - id: grasp_tube2
    action_class: grasp
    demo_segment: { index: 4, t: [8.5, 10.5], label: "Lift and transport the third tube towards the rack" }
    actor_arm: left_arm
    objects: { manipulated: tube2 }
    preconditions: [gripper_empty(actor), on_table(tube2), upright(tube2)]
    postconditions: [holding(actor, tube2)]
    constraints:
      - { type: grasp_constraint, inherit_from: grasp_tube0 }
    verify: { method: pick_verifier, use_model: true }
    recovery: { inherit_from: grasp_tube0 }

  - id: insert_tube2
    action_class: insert
    demo_segment: { index: 5, t: [10.5, 12.8], label: "Insert the third tube into the rack" }
    actor_arm: left_arm
    objects: { manipulated: tube2, target: rack }
    preconditions: [holding(actor, tube2), slot_available(rack, slot_of(tube2))]
    postconditions: [inserted(tube2, rack), upright(tube2), gripper_empty(actor)]
    constraints:
      - { inherit_from: insert_tube0.constraints }
    slot_binding: { rule: distinct_empty_slot, demo_choice: slot_index_2 }
    approach_hint: { inherit_from: insert_tube0 }
    verify: { method: predicate, predicates: [inserted(tube2, rack), upright(tube2)] }

  - id: go_home
    action_class: home
    demo_segment: null                         # 演示未包含；来自成功谓词 robot_home。provenance: task_spec
    preconditions: [gripper_empty(actor)]
    postconditions: [robot_home(robot)]

edges:
  - { from: grasp_tube0, to: insert_tube0, type: sequence,
      carry_constraint: { tube_axis_tilt_max_deg: 15, min_clearance_above_rack_m: 0.15 } }  # provenance: demo_video + 判断
  - { from: insert_tube0, to: grasp_tube1, type: sequence }
  - { from: grasp_tube1, to: insert_tube1, type: sequence,
      carry_constraint: { inherit_from: edge_0 } }
  - { from: insert_tube1, to: grasp_tube2, type: sequence }
  - { from: grasp_tube2, to: insert_tube2, type: sequence,
      carry_constraint: { inherit_from: edge_0 } }
  - { from: insert_tube2, to: go_home, type: sequence }

  # 资源边：三根管占三个不同槽位（v7 workflow 缺失的关键信息）
  - { type: resource, resource: rack.slots,
      consumers: [insert_tube0, insert_tube1, insert_tube2],
      rule: distinct_empty_slot, demo_order: left_to_right }

  # 碰撞边：已插入的管成为后续插入的障碍
  - { type: collision_avoid, obstacle_after: insert_tube0, applies_to: [insert_tube1, insert_tube2],
      note: "pre-insert 横移与下插路径须避开已插入试管，横向安全距离 >= 0.03m" }
  - { type: collision_avoid, obstacle_after: insert_tube1, applies_to: [insert_tube2] }

task_success:
  all_of:                                      # provenance: task_spec（与 task.yaml 谓词一致）
    - inserted(tube0, rack)
    - upright(tube0)
    - inserted(tube1, rack)
    - upright(tube1)
    - inserted(tube2, rack)
    - upright(tube2)
    - robot_home(robot)

compile_notes:
  runtime: knowin-world k1-sys-v0
  action_mapping:
    locate: "/head/reasoning/qwen_xquat(text=<locate_label>, offsets=[0,0,<z_offset>])"
    free_motion: "/ctrl/follow_xquat_trajectory"
    guarded_motion: "/ctrl/local_delta_move(delta_xyz, force_threshold, gpos)"
    gripper: "/ctrl/set_gripper"
    grasp_verify: "pickplace/pick_verifier.yaml(use_model=true)"
    home: "/ctrl/go_home"
  arm_mapping: "当前单臂 harness：所有 actor_arm 映射 arm_id=0；双臂就绪后按 demo 恢复"
  slot_binding_hint: >
    rack 目前只有单一 locate label。槽位区分的临时方案：对 qwen_xquat 返回的 rack 位姿
    施加横向 offset（按 demo_order 从左到右均分）；正式方案需 asset 槽位坐标或视觉亚定位。
  known_infra_issue: >
    v7 run (2026-07-22) 失败于 /ctrl/local_delta_move 的 401 服务鉴权错误（infra 而非几何）。
    跑 oracle 实验前先用单条 local_delta_move smoke 验证服务链路。
