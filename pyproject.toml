[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-graph-lab"
version = "0.1.0"
description = "Demo-conditioned constraint graphs for long-horizon robot manipulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pipeline = [
    "Jinja2>=3.1",
    "openai>=1.0",
    "opencv-python>=4.8",
]
live = ["numpy>=1.26", "opencv-python>=4.8"]
dev = ["pytest>=8", "numpy>=1.26", "opencv-python>=4.8"]

[project.scripts]
dgl = "demo_graph_lab.cli:main"
dgl-oracle = "demo_graph_lab.execution.cli:main"

[tool.setuptools.package-data]
demo_graph_lab = ["prompts/*.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
